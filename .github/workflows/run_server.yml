
name: Run HTTP Server with ngrok

on:
  workflow_dispatch:   # 手动触发，可选择分支

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download web resources
        run: python3 _download_web.py

      # 关键：将服务器启动和 ngrok 启动放在同一个步骤中
      - name: Start Server & Ngrok (Parallel)
        run: |
          # 1. 启动 HTTP 服务器（nohup 可防止被挂断，但放在同一个步骤中其实不必须，但留着更安全）
          export AUTOPCR_SERVER_HOST=0.0.0.0
          export AUTOPCR_SERVER_PORT=8080
          nohup python3 _httpserver_test.py > server.log 2>&1 &
          
          # 2. 安装 ngrok
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          
          # 3. 配置 ngrok（需要提前在 Secrets 中设置 NGROK_AUTHTOKEN）
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          
          # 4. 启动 ngrok 隧道（后台运行）
          ngrok http 8080 > /dev/null 2>&1 &
          
          # 5. 等待服务就绪并打印公网 URL
          sleep 5
          echo "✅ Public URL:"
          curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo ""
          echo "⏳ 按 Ctrl+C 或手动取消工作流以停止..."
          
          # 6. 关键：wait 让步骤持续运行，同时守护后台的 server 和 ngrok 进程
          wait
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
